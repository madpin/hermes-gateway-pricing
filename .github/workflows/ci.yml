name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"  # weekly: catch Hermes API changes on main early
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff check .
      - run: uvx ruff format --check .

  ui:
    # desktop/plugin.js under vitest + jsdom, against tests/ui/sdk-stub.js and fixtures generated from
    # the real backend (their drift is checked by tests/test_ui_fixtures.py in the test job). The real
    # SDK index and component sources come from a shallow Hermes clone, so the import and stub-contract
    # checks run instead of skipping. The clone lives OUTSIDE the workspace, so nothing scans it as
    # part of this repo.
    runs-on: ubuntu-latest
    env:
      HERMES_SRC: ${{ github.workspace }}/../hermes-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Shallow-clone Hermes main (SDK index and component sources, read only)
        run: git clone --depth 1 https://github.com/NousResearch/hermes-agent "$HERMES_SRC"

      - name: Install the UI test tools (exact versions from tests/ui/package-lock.json)
        working-directory: tests/ui
        run: npm ci --no-audit --no-fund

      - name: UI tests
        working-directory: tests/ui
        run: |
          export HERMES_SDK_INDEX="$HERMES_SRC/apps/desktop/src/sdk/index.ts"
          export HERMES_DESKTOP_SRC="$HERMES_SRC/apps/desktop/src"
          npx vitest run

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
        # The compatibility claim in README.md names exactly these two. Bump the pinned release
        # (and the README) together.
        hermes: [main, v2026.9.24]
    env:
      HERMES_SRC: ${{ github.workspace }}/../hermes-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Shallow-clone Hermes ${{ matrix.hermes }} (outside the workspace)
        run: git clone --depth 1 --branch "${{ matrix.hermes }}" https://github.com/NousResearch/hermes-agent "$HERMES_SRC"

      - name: Install test tools and the minimum Hermes needs to import agent.usage_pricing / hermes_cli
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi httpx pydantic requests ruamel.yaml pyyaml python-dotenv
          # Fall back to Hermes' declared dependencies if the minimal set is not enough to import it.
          code=0
          PYTHONPATH="$HERMES_SRC" python scripts/check_hermes_compat.py || code=$?
          if [ "$code" -eq 2 ]; then python -m pip install "$HERMES_SRC"; fi

      - name: Hermes API contract
        run: PYTHONPATH="$HERMES_SRC" python scripts/check_hermes_compat.py

      - name: Tests
        run: python -m pytest -q -rs

      # Validates the plugin directory alone (never the Hermes clone). Fails unless every expected
      # check ran and the failures are exactly the documented ones: on main, "no core override"
      # (README "Why this is not in the plugin catalog"); v2026.9.24 predates that check and "oauth".
      - name: Admission validator (only "no core override" may fail)
        env:
          HERMES_LEG: ${{ matrix.hermes }}
        run: |
          PYTHONPATH="$HERMES_SRC" python - <<'EOF'
          import os
          from pathlib import Path
          from hermes_cli.plugin_validate import validate_plugin_dir

          release_checks = [
              "manifest", "manifest fields", "requires_hermes", "config schema", "requires_env", "loadable",
              "python dependencies", "capability probe", "declared tools", "declared hooks",
              "declared middleware", "built-in tool collisions", "security scan", "desktop surface",
          ]
          if os.environ["HERMES_LEG"] == "main":
              required, allowed_failures = release_checks + ["oauth", "no core override"], ["no core override"]
          else:
              required, allowed_failures = release_checks, []
          plugin_dir = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          hermes_dir = Path(os.environ["HERMES_SRC"]).resolve()
          assert not hermes_dir.is_relative_to(plugin_dir), f"Hermes clone {hermes_dir} is inside {plugin_dir}"
          report = validate_plugin_dir(plugin_dir)
          for check in report.checks:
              print("PASS" if check[1] else "FAIL", *check[::2])
          for warning in report.warnings:
              print("WARN", warning)
          ran = [c[0] for c in report.checks]
          failed = [c[0] for c in report.checks if not c[1]]
          missing = [name for name in required if name not in ran]
          if "no core override" not in ran:
              print("NOTE this Hermes has no 'no core override' check")
          problems = []
          if missing:
              problems.append(f"expected checks did not run: {missing}")
          if failed != allowed_failures:
              problems.append(f"failed checks {failed}, expected exactly {allowed_failures}")
          for problem in problems:
              print("ERROR", problem)
          raise SystemExit(1 if problems else 0)
          EOF
