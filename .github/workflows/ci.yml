name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"  # weekly: catch Hermes API changes on main early
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff check .
      - run: uvx ruff format --check .

  ui:
    # desktop/plugin.js under vitest + jsdom, against tests/ui/sdk-stub.js and fixtures generated from
    # the real backend (their drift is checked by tests/test_ui_fixtures.py in the test job). The real
    # SDK index and component sources come from a shallow Hermes clone, so the import and stub-contract
    # checks run instead of skipping.
    runs-on: ubuntu-latest
    env:
      HERMES_SRC: ${{ github.workspace }}/hermes-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Shallow-clone Hermes main (SDK index and component sources, read only)
        run: git clone --depth 1 https://github.com/NousResearch/hermes-agent "$HERMES_SRC"

      - name: Install the UI test tools (pinned in tests/ui/package.json)
        working-directory: tests/ui
        run: npm install --no-audit --no-fund

      - name: UI tests
        working-directory: tests/ui
        env:
          HERMES_SDK_INDEX: ${{ github.workspace }}/hermes-agent/apps/desktop/src/sdk/index.ts
          HERMES_DESKTOP_SRC: ${{ github.workspace }}/hermes-agent/apps/desktop/src
        run: npx vitest run

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
        hermes: [main, latest-release]
    env:
      HERMES_SRC: ${{ github.workspace }}/hermes-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Resolve Hermes ref
        id: ref
        run: |
          if [ "${{ matrix.hermes }}" = "main" ]; then
            echo "ref=main" >> "$GITHUB_OUTPUT"
          else
            tag=$(git ls-remote --tags --refs --sort=-v:refname https://github.com/NousResearch/hermes-agent 'v*' \
                  | head -n1 | sed 's#.*refs/tags/##')
            echo "ref=${tag}" >> "$GITHUB_OUTPUT"
          fi

      - name: Shallow-clone Hermes ${{ steps.ref.outputs.ref }}
        run: git clone --depth 1 --branch "${{ steps.ref.outputs.ref }}" https://github.com/NousResearch/hermes-agent "$HERMES_SRC"

      - name: Install test tools and the minimum Hermes needs to import agent.usage_pricing / hermes_cli
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi httpx pydantic requests ruamel.yaml pyyaml python-dotenv
          # Fall back to Hermes' declared dependencies if the minimal set is not enough to import it.
          code=0
          PYTHONPATH="$HERMES_SRC" python scripts/check_hermes_compat.py || code=$?
          if [ "$code" -eq 2 ]; then python -m pip install "$HERMES_SRC"; fi

      - name: Hermes API contract
        run: PYTHONPATH="$HERMES_SRC" python scripts/check_hermes_compat.py

      - name: Tests
        run: python -m pytest -q

      # Fails the build if anything other than the documented "no core override" finding fails.
      - name: Admission validator (only "no core override" may fail)
        run: |
          PYTHONPATH="$HERMES_SRC" python - <<'EOF'
          from pathlib import Path
          from hermes_cli.plugin_validate import validate_plugin_dir
          report = validate_plugin_dir(Path("."))
          failed = [c for c in report.checks if not c[1]]
          for check in report.checks:
              print("PASS" if check[1] else "FAIL", *check[::2])
          for warning in report.warnings:
              print("WARN", warning)
          raise SystemExit(0 if [c[0] for c in failed] == ["no core override"] else 1)
          EOF
